<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Presensi & Laporan Kerja - Puskesmas</title>
  <style>
    * { 
      box-sizing: border-box; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    }

    /* Background Utama Tema Puskesmas / Kesehatan */
    body { 
      margin: 0; 
      padding: 20px 15px; 
      min-height: 100vh;
      display: flex; 
      justify-content: center; 
      align-items: center;
      /* Gradien Segar khas Layanan Kesehatan + Pola Medis Halus */
      background: linear-gradient(135deg, rgba(15, 118, 110, 0.85), rgba(13, 148, 136, 0.85)),
                  url('https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?auto=format&fit=crop&w=1200&q=80');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    /* Card Utama dengan efek Glassmorphism */
    .card { 
      background: rgba(255, 255, 255, 0.96); 
      padding: 25px; 
      border-radius: 16px; 
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); 
      width: 100%; 
      max-width: 480px; 
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    /* Header Puskesmas */
    .header-puskesmas {
      text-align: center;
      margin-bottom: 20px;
    }
    .header-puskesmas h2 {
      margin: 0;
      color: #0f766e;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .header-puskesmas p {
      margin: 4px 0 0 0;
      color: #64748b;
      font-size: 13px;
    }
    
    /* Navigation Tab */
    .tabs { 
      display: flex; 
      border-bottom: 2px solid #e2e8f0; 
      margin-bottom: 20px; 
    }
    .tab-btn { 
      flex: 1; 
      padding: 10px 5px; 
      border: none; 
      background: none; 
      cursor: pointer; 
      font-weight: 600; 
      color: #64748b; 
      font-size: 14px; 
      transition: all 0.2s;
    }
    .tab-btn.active { 
      color: #0f766e; 
      border-bottom: 3px solid #0f766e; 
    }
    
    /* Form Style */
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; color: #334155; font-size: 14px; }
    input, select, textarea { 
      width: 100%; 
      padding: 11px 12px; 
      border: 1px solid #cbd5e1; 
      border-radius: 8px; 
      font-size: 14px; 
      outline: none; 
      background-color: #f8fafc;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus { 
      border-color: #0f766e; 
      background-color: #fff;
    }
    textarea { resize: vertical; height: 80px; }
    
    /* Box Kamera */
    .camera-box { 
      text-align: center; 
      background: #f1f5f9; 
      border-radius: 12px; 
      padding: 12px; 
      margin-bottom: 20px; 
      border: 1px dashed #cbd5e1;
    }
    video, img { 
      width: 100%; 
      height: 220px; 
      border-radius: 8px; 
      object-fit: cover; 
      background: #e2e8f0; 
    }
    
    /* Style Efek Cermin Kamera Depan */
    .mirror {
      transform: scaleX(-1);
      -webkit-transform: scaleX(-1);
    }
    
    /* Container Tombol Aksi Foto */
    .photo-action-btns {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    
    /* Button Style */
    .btn { 
      width: 100%; 
      padding: 12px; 
      border: none; 
      border-radius: 8px; 
      background: #0f766e; 
      color: white; 
      font-size: 15px; 
      font-weight: bold; 
      cursor: pointer; 
      transition: 0.2s; 
      box-shadow: 0 2px 6px rgba(15, 118, 110, 0.2);
    }
    .btn:hover { opacity: 0.9; }
    .btn-camera { background: #475569; margin-top: 10px; font-size: 15px; }
    .btn-retry { background: #d97706; color: white; }
    .btn-confirm { background: #16a34a; color: white; }
    
    /* Status Foto Kunci */
    .status-foto {
      margin-top: 8px;
      font-size: 13px;
      font-weight: bold;
      color: #16a34a;
      display: none;
    }
    
    /* Loading Indicator */
    #loading { 
      display: none; 
      text-align: center; 
      font-weight: bold; 
      color: #0f766e; 
      margin-top: 15px; 
      padding: 10px; 
      background: #ccfbf1; 
      border-radius: 6px; 
    }
  </style>
</head>
<body>

<div class="card">
  <!-- Header Bertema Puskesmas -->
  <div class="header-puskesmas">
    <h2>🏥 PRESENSI PUSKESMAS LONG MESANGAT</h2>
    <p>Sistem Informasi Pelaporan & Kehadiran Pegawai</p>
  </div>

  <!-- 1. Menu Tab (Atas) -->
  <div class="tabs">
    <button class="tab-btn active" onclick="bukaTab(event, 'tab-masuk')">Masuk</button>
    <button class="tab-btn" onclick="bukaTab(event, 'tab-pulang')">Pulang</button>
    <button class="tab-btn" onclick="bukaTab(event, 'tab-izin')">Izin</button>
    <button class="tab-btn" onclick="bukaTab(event, 'tab-laporan')">Laporan</button>
  </div>

  <!-- 2. Input Nama Pegawai -->
  <div class="form-group">
    <label for="nama">Nama Pegawai:</label>
    <select id="nama">
      <option value="">-- Pilih Nama Karyawan --</option>
      <option value="Ayu Setnia Sulistio Putri">Ayu Setnia Sulistio Putri</option>
      <option value="Badriyah Ani Kusuma Putri">Badriyah Ani Kusuma Putri</option>
      <option value="Dwi Erma Wahana">Dwi Erma Wahana</option>
      <option value="Helda Fitriana">Helda Fitriana</option>
      <option value="Linda Ayu Puspita Sari">Linda Ayu Puspita Sari</option>
      <option value="Maria Emensia Ero Ruing">Maria Emensia Ero Ruing</option>
      <option value="Muhammad Anggriawan">Muhammad Anggriawan</option>
      <option value="Putri Mila Victoria">Putri Mila Victoria</option>
      <option value="Siska Dwi Yuliani">Siska Dwi Yuliani</option>
      <option value="Siti Kholifah">Siti Kholifah</option>
      <option value="Sugeng Islamuddin">Sugeng Islamuddin</option>
      <option value="Yeni Berria">Yeni Berria</option>
    </select>
  </div>

  <!-- 3. Box Kamera Global -->
  <div class="camera-box" id="box-kamera">
    <video id="video" autoplay playsinline class="mirror"></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <img id="preview-foto" style="display:none;" alt="Preview Foto">
    
    <!-- Tombol Ambil Foto Awal -->
    <button type="button" class="btn btn-camera" id="btn-foto" onclick="ambilFoto()">📸 Ambil Foto</button>

    <!-- Tombol Konfirmasi -->
    <div id="group-konfirmasi" class="photo-action-btns" style="display:none;">
      <button type="button" class="btn btn-retry" onclick="fotoUlang()">🔄 Foto Ulang</button>
      <button type="button" class="btn btn-confirm" onclick="konfirmasiFoto()">✅ Gunakan Foto Ini</button>
    </div>
    
    <div id="status-foto-fix" class="status-foto">✓ Foto Siap Digunakan</div>
  </div>

  <!-- 4. KONTEN MASING-MASING TAB -->

  <!-- TAB ABSEN MASUK -->
  <div id="tab-masuk" class="tab-content">
    <div class="form-group">
      <label for="status">Status Kehadiran:</label>
      <select id="status">
        <option value="PUSKESMAS">PUSKESMAS</option>
        <option value="DINAS">DINAS PUSBAN</option>
        
      </select>
    </div>
    <div class="form-group">
      <label for="wilayahAbsen">Lokasi / Rujukan:</label>
      <select id="wilayahAbsen">
        <option value="">-- Pilih Lokasi / Rujukan --</option>
        <option value="Muara Bengkal">Muara Bengkal</option>
        <option value="Samarinda">Samarinda</option>
        <option value="Tenggarong">Tenggarong</option>
        <option value="Sangata">Sangata</option>
        <option value="Bontang">Bontang</option>
        <option value="Balikpapan">Balikpapan</option>
      </select>
    </div>
    <div class="form-group">
      <label for="keterangan-masuk">Keterangan/Catatan:</label>
      <input type="text" id="keterangan-masuk" placeholder="Contoh: Datang tepat waktu">
    </div>
    <button class="btn" onclick="kirimAbsenMasuk()">Kirim Absen Masuk</button>
  </div>

  <!-- TAB ABSEN PULANG -->
  <div id="tab-pulang" class="tab-content" style="display:none;">
    <p style="text-align:center; color:#475569; font-size:14px; margin-bottom:15px;">Ambil foto untuk verifikasi presensi pulang harian.</p>
    <button class="btn" style="background:#dc2626;" onclick="kirimAbsenPulang()">Kirim Absen Pulang</button>
  </div>

  <!-- TAB IZIN -->
  <div id="tab-izin" class="tab-content" style="display:none;">
    <div class="form-group">
      <label for="keterangan-izin">Alasan Izin / Sakit:</label>
      <textarea id="keterangan-izin" placeholder="Tuliskan alasan pengajuan izin secara detail..."></textarea>
    </div>
    <button class="btn" style="background:#d97706; color:white;" onclick="kirimIzin()">Kirim Pengajuan Izin</button>
  </div>

  <!-- TAB LAPORAN KERJA -->
  <div id="tab-laporan" class="tab-content" style="display:none;">
    <div class="form-group">
      <label for="judul-laporan">Judul Laporan Kerja:</label>
      <input type="text" id="judul-laporan" placeholder="Masukkan judul kegiatan/laporan...">
    </div>
    <button class="btn" style="background:#16a34a;" onclick="kirimLaporanKerja()">Kirim Laporan Kerja</button>
  </div>

  <!-- Loading Status -->
  <div id="loading">Memproses data, mohon tunggu...</div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwHh4nxokmx_hSyLPMJg9GQYjDXuDFUA5Z6GfGN-vSglje5f2mgeBGEqQFyOsk4O_zv/exec";

  let tempBase64Foto = ""; 
  let base64Foto = "";     
  let userLocation = { latitude: "", longitude: "", maps: "" };
  let currentStream = null;
  let modeKameraSaatIni = "user";

  window.onload = function() {
    initKamera("user");
    initGPS();
  };

  // Switch Tab
  function bukaTab(evt, namaTab) {
    let contents = document.getElementsByClassName("tab-content");
    for (let i = 0; i < contents.length; i++) contents[i].style.display = "none";
    
    let btns = document.getElementsByClassName("tab-btn");
    for (let i = 0; i < btns.length; i++) btns[i].classList.remove("active");

    document.getElementById(namaTab).style.display = "block";
    evt.currentTarget.classList.add("active");

    let boxKamera = document.getElementById("box-kamera");

    if (namaTab === 'tab-izin') {
      boxKamera.style.display = "none";
      matikanKamera();
    } else {
      boxKamera.style.display = "block";
      let targetMode = (namaTab === 'tab-laporan') ? "environment" : "user";
      if (modeKameraSaatIni !== targetMode || !currentStream) {
        initKamera(targetMode);
      }
    }
    
    resetTampilanFoto();
  }

  // Kamera Handlers
  function matikanKamera() {
    if (currentStream) {
      currentStream.getTracks().forEach(track => track.stop());
      currentStream = null;
    }
  }

  function initKamera(mode) {
    matikanKamera();
    modeKameraSaatIni = mode;

    let video = document.getElementById("video");
    let preview = document.getElementById("preview-foto");

    if (mode === "user") {
      video.classList.add("mirror");
      preview.classList.add("mirror");
    } else {
      video.classList.remove("mirror");
      preview.classList.remove("mirror");
    }

    let constraints = {
      video: { facingMode: mode === "environment" ? { ideal: "environment" } : "user" }
    };

    navigator.mediaDevices.getUserMedia(constraints)
      .then(stream => {
        currentStream = stream;
        video.srcObject = stream;
      })
      .catch(err => {
        alert("Gagal mengakses kamera: " + err.message);
      });
  }

  // Ambil Foto & Kompresi Otomatis Maksimal 700 KB
  function ambilFoto() {
    let video = document.getElementById("video");
    let canvas = document.getElementById("canvas");
    let preview = document.getElementById("preview-foto");
    let context = canvas.getContext("2d");

    canvas.width = 480;
    canvas.height = 640;

    if (modeKameraSaatIni === "user") {
      context.translate(canvas.width, 0);
      context.scale(-1, 1);
    }

    context.drawImage(video, 0, 0, canvas.width, canvas.height);

    // Algoritma Kompresi Otomatis Maksimal 700 KB
    let quality = 0.7;
    tempBase64Foto = canvas.toDataURL("image/jpeg", quality);

    let sizeInKB = (tempBase64Foto.length * (3 / 4)) / 1024;

    while (sizeInKB > 700 && quality > 0.1) {
      quality -= 0.1;
      tempBase64Foto = canvas.toDataURL("image/jpeg", quality);
      sizeInKB = (tempBase64Foto.length * (3 / 4)) / 1024;
    }

    preview.src = tempBase64Foto;
    
    preview.style.display = "block";
    video.style.display = "none";
    
    document.getElementById("btn-foto").style.display = "none";
    document.getElementById("group-konfirmasi").style.display = "flex";
    document.getElementById("status-foto-fix").style.display = "none";
  }

  function fotoUlang() {
    tempBase64Foto = "";
    base64Foto = "";
    document.getElementById("preview-foto").style.display = "none";
    document.getElementById("video").style.display = "block";
    
    document.getElementById("btn-foto").style.display = "block";
    document.getElementById("group-konfirmasi").style.display = "none";
    document.getElementById("status-foto-fix").style.display = "none";
  }

  function konfirmasiFoto() {
    base64Foto = tempBase64Foto;
    document.getElementById("group-konfirmasi").style.display = "none";
    document.getElementById("status-foto-fix").style.display = "block";
    alert("Foto berhasil dikonfirmasi! Silakan klik tombol Kirim.");
  }

  function resetTampilanFoto() {
    tempBase64Foto = "";
    base64Foto = "";
    document.getElementById("preview-foto").style.display = "none";
    document.getElementById("video").style.display = "block";
    document.getElementById("btn-foto").style.display = "block";
    document.getElementById("group-konfirmasi").style.display = "none";
    document.getElementById("status-foto-fix").style.display = "none";
  }

  // Geolocation Handler
  function initGPS() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(position => {
        userLocation.latitude = position.coords.latitude;
        userLocation.longitude = position.coords.longitude;
        userLocation.maps = `https://maps.google.com/?q=${userLocation.latitude},${userLocation.longitude}`;
      }, error => {
        console.warn("GPS tidak aktif atau tidak diizinkan.");
      });
    }
  }

  // Fetch API / Pengiriman Data
  async function kirimData(payload) {
    let loading = document.getElementById("loading");
    loading.style.display = "block";

    try {
      let response = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      let textHasil = await response.text();
      alert(textHasil);
      resetForm();
    } catch (error) {
      alert("Gagal Mengirim Data: " + error.message);
    } finally {
      loading.style.display = "none";
    }
  }

  function kirimAbsenMasuk() {
    let nama = document.getElementById("nama").value;
    let wilayah = document.getElementById("wilayahAbsen").value;
    let ket = document.getElementById("keterangan-masuk").value;

    if (!nama) return alert("Pilih Nama Anda terlebih dahulu!");
    if (!base64Foto) return alert("Silakan konfirmasi foto Anda terlebih dahulu dengan menekan 'Gunakan Foto Ini'!");

    let ketGabungan = ket;
    if (wilayah) {
      ketGabungan = ket ? ket + " (" + wilayah + ")" : wilayah;
    }

    kirimData({
      aksi: "masuk",
      nama: nama,
      status: document.getElementById("status").value,
      fotoMasuk: base64Foto,
      keterangan: ketGabungan,
      latitude: userLocation.latitude,
      longitude: userLocation.longitude,
      maps: userLocation.maps
    });
  }

  function kirimAbsenPulang() {
    let nama = document.getElementById("nama").value;
    if (!nama) return alert("Pilih Nama Anda terlebih dahulu!");
    if (!base64Foto) return alert("Silakan konfirmasi foto Anda terlebih dahulu dengan menekan 'Gunakan Foto Ini'!");

    kirimData({
      aksi: "pulang",
      nama: nama,
      fotoPulang: base64Foto
    });
  }

  function kirimIzin() {
    let nama = document.getElementById("nama").value;
    let keterangan = document.getElementById("keterangan-izin").value;
    if (!nama) return alert("Pilih Nama Anda terlebih dahulu!");
    if (!keterangan) return alert("Isikan alasan pengajuan izin!");

    kirimData({
      aksi: "izin",
      nama: nama,
      keterangan: keterangan
    });
  }

  function kirimLaporanKerja() {
    let nama = document.getElementById("nama").value;
    let judul = document.getElementById("judul-laporan").value;
    if (!nama) return alert("Pilih Nama Anda terlebih dahulu!");
    if (!judul) return alert("Tuliskan Judul Laporan Kerja Anda!");
    if (!base64Foto) return alert("Silakan konfirmasi foto Anda terlebih dahulu dengan menekan 'Gunakan Foto Ini'!");

    kirimData({
      aksi: "laporan",
      nama: nama,
      judul: judul,
      foto: base64Foto
    });
  }

  function resetForm() {
    resetTampilanFoto();
    document.getElementById("keterangan-masuk").value = "";
    document.getElementById("keterangan-izin").value = "";
    document.getElementById("judul-laporan").value = "";
    document.getElementById("wilayahAbsen").value = "";
  }
</script>

</body>
</html>
