<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Absensi Puskesmas</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
text-align:center;
padding:20px;
}

h2{
color:#1a73e8;
}

input,select,textarea{

width:90%;
padding:12px;
font-size:16px;
margin:10px;
border-radius:8px;
border:1px solid #ccc;

}

button{

width:90%;
padding:14px;
margin:8px;
font-size:16px;
border:none;
border-radius:8px;
color:white;

}

#masukBtn{
background:#1a73e8;
}

#pulangBtn{
background:#e53935;
}

#izinBtn{
background:#8e24aa;
}

#kirimIzinBtn{
background:#7b1fa2;
}

#laporanBtn{
background:#43a047;
}

video{

width:300px;
height:230px;
object-fit:cover;
border-radius:12px;
border:2px solid #ddd;
margin-top:10px;

}

#hasil{

font-weight:bold;
color:green;

}

#formIzin{

display:none;
background:white;
padding:10px;
border-radius:10px;

}

</style>

</head>


<body>


<h2>
ABSENSI KARYAWAN
</h2>


<input 
id="nama"
placeholder="Masukkan Nama">


<br>


<select id="modeAbsen">

<option value="Absen Puskesmas">
🏥 Absen Puskesmas
</option>

<option value="Tugas Rujukan">
🚑 Tugas Rujukan
</option>

<option value="Dinas Pusban">
🏘️ Dinas Pusban
</option>

</select>


<br>


<video
id="kamera"
autoplay
playsinline
muted>
</video>


<canvas
id="canvas"
style="display:none;">
</canvas>


<br>


<button id="masukBtn" onclick="absenMasuk()">

📍 ABSEN MASUK

</button>


<button id="pulangBtn" onclick="absenPulang()">

🚪 ABSEN PULANG

</button>


<button id="izinBtn" onclick="bukaIzin()">

📝 AJUKAN IZIN

</button>


<div id="formIzin">

<h3>
FORM IZIN
</h3>


<select id="jenisIzin">

<option value="Sakit">
Sakit
</option>

<option value="Keperluan Keluarga">
Keperluan Keluarga
</option>

<option value="Lainnya">
Lainnya
</option>

</select>


<textarea
id="keteranganIzin"
placeholder="Keterangan izin">
</textarea>


<button id="kirimIzinBtn" onclick="kirimIzin()">

KIRIM IZIN

</button>


</div>


<hr>


<h3>
LAPORAN KERJA
</h3>


<input

type="file"

id="fotoLaporan"

accept="image/*"

capture="environment"

style="display:none"

onchange="kirimLaporan()">


<button

id="laporanBtn"

onclick="bukaKameraLaporan()">

📷 FOTO LAPORAN KERJA

</button>


<p id="hasil"></p>



<script>


//==============================
// URL APPS SCRIPT
//==============================


const URL_APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbwHh4nxokmx_hSyLPMJg9GQYjDXuDFUA5Z6GfGN-vSglje5f2mgeBGEqQFyOsk4O_zv/exec";



//==============================
// GLOBAL
//==============================


let kameraStream=null;

let latitude="";

let longitude="";



//==============================
// LOKASI
//==============================


const DAFTAR_LOKASI=[

{
nama:"Puskesmas Long Mesangat",
lat:0.636402,
lng:116.693940,
radius:5000
},

{
nama:"Samarinda",
lat:-0.5022,
lng:117.1536,
radius:30000
},

{
nama:"Sangatta",
lat:0.4948,
lng:117.1436,
radius:30000
},

{
nama:"Tenggarong",
lat:-0.4267,
lng:116.9872,
radius:30000
},

{
nama:"Muara Bengkal",
lat:0.1040,
lng:116.9000,
radius:30000
}

];



//==============================
// KIRIM DATA KE APPS SCRIPT
//==============================


function kirimKeServer(data){

return fetch(URL_APPS_SCRIPT,{

method:"POST",

headers:{
"Content-Type":"text/plain;charset=utf-8"
},

body:JSON.stringify(data)

})

.then(function(res){

return res.text();

});


}

//==============================
// HITUNG JARAK GPS
//==============================


function hitungJarak(lat1,lon1,lat2,lon2){

const R=6371000;

const dLat=(lat2-lat1)*Math.PI/180;

const dLon=(lon2-lon1)*Math.PI/180;


const a=

Math.sin(dLat/2)*
Math.sin(dLat/2)

+

Math.cos(lat1*Math.PI/180)*
Math.cos(lat2*Math.PI/180)

*

Math.sin(dLon/2)*
Math.sin(dLon/2);


const c=

2*Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
);


return R*c;

}



//==============================
// CEK WILAYAH
//==============================


function cekWilayahAbsen(lat,lng){

let wilayah="Tidak dikenal";


DAFTAR_LOKASI.forEach(function(item){

let jarak=
hitungJarak(
lat,
lng,
item.lat,
item.lng
);


if(jarak<=item.radius){

wilayah=item.nama;

}


});


return wilayah;

}




//==============================
// BUKA KAMERA
//==============================


function bukaKameraDepan(){


const video=
document.getElementById("kamera");


return navigator.mediaDevices.getUserMedia({

video:{
facingMode:"user",
width:640,
height:480
},

audio:false

})


.then(function(stream){


kameraStream=stream;

video.srcObject=stream;


document.getElementById("hasil").innerHTML=
"✅ Kamera aktif";


return true;


})


.catch(function(error){


document.getElementById("hasil").innerHTML=
"❌ Kamera gagal : "+error.message;


return false;


});


}




//==============================
// KOMPRES FOTO
//==============================


function kompresFoto(canvas){


let kualitas=0.5;


let foto=
canvas.toDataURL(
"image/jpeg",
kualitas
);



while(
foto.length>600000 &&
kualitas>0.2
){

kualitas-=0.1;


foto=
canvas.toDataURL(
"image/jpeg",
kualitas
);


}


return foto;

}




//==============================
// AMBIL FOTO
//==============================


function ambilFoto(jenis){


let video=
document.getElementById("kamera");


if(video.videoWidth==0){

alert("Kamera belum siap");

return "";

}



let canvas=
document.getElementById("canvas");


canvas.width=640;

canvas.height=480;


let ctx=
canvas.getContext("2d");


ctx.drawImage(
video,
0,
0,
640,
480
);



// watermark


ctx.fillStyle=
"rgba(0,0,0,0.6)";


ctx.fillRect(
0,
350,
640,
130
);



ctx.fillStyle="white";

ctx.font="20px Arial";


let nama=
document.getElementById("nama").value;


let waktu=
new Date();



ctx.fillText(
"UPT PUSKESMAS LONG MESANGAT",
20,
380
);


ctx.fillText(
"Nama : "+nama,
20,
410
);


ctx.fillText(
jenis,
20,
440
);


ctx.fillText(
"Jam : "+
waktu.toLocaleTimeString("id-ID"),
20,
470
);



return kompresFoto(canvas);


}





//==============================
// ABSEN MASUK
//==============================


async function absenMasuk(){


let nama=
document.getElementById("nama")
.value.trim();



if(nama==""){

alert("Isi nama terlebih dahulu");

return;

}



// aktifkan kamera


if(!kameraStream){

let aktif=
await bukaKameraDepan();


if(!aktif){

return;

}


await new Promise(function(resolve){

setTimeout(resolve,2000);

});


}




document.getElementById("hasil").innerHTML=
"Mengambil lokasi...";



navigator.geolocation.getCurrentPosition(


async function(pos){


latitude=
pos.coords.latitude;


longitude=
pos.coords.longitude;



let wilayah=
cekWilayahAbsen(
latitude,
longitude
);



let maps=

"https://maps.google.com/?q="+
latitude+
","+
longitude;



let foto=
ambilFoto("ABSEN MASUK");



if(foto==""){


document.getElementById("hasil").innerHTML=
"❌ Foto gagal";


return;

}



document.getElementById("hasil").innerHTML=
"Mengirim absen masuk...";



try{


let hasil=
await kirimKeServer({

aksi:"masuk",

nama:nama,

status:"HADIR",

keterangan:
document.getElementById("modeAbsen").value,

latitude:latitude,

longitude:longitude,

wilayahAbsen:wilayah,

maps:maps,

fotoMasuk:foto


});



document.getElementById("hasil").innerHTML=

"✅ ABSEN MASUK BERHASIL<br>"+hasil;



}

catch(error){


document.getElementById("hasil").innerHTML=

"❌ Gagal kirim : "+error.message;


}



},



function(){


document.getElementById("hasil").innerHTML=

"❌ GPS tidak aktif";


},



{

enableHighAccuracy:true,

timeout:15000,

maximumAge:0

}


);



}

//==============================
// ABSEN PULANG
//==============================


async function absenPulang(){


let nama=
document.getElementById("nama")
.value.trim();



if(nama==""){

alert("Isi nama terlebih dahulu");

return;

}



// aktifkan kamera jika belum aktif


if(!kameraStream){


let aktif=
await bukaKameraDepan();


if(!aktif){

return;

}


await new Promise(function(resolve){

setTimeout(resolve,2000);

});


}




let foto=
ambilFoto("ABSEN PULANG");



if(foto==""){


document.getElementById("hasil").innerHTML=
"❌ Foto pulang gagal";


return;

}



document.getElementById("hasil").innerHTML=
"Mengirim absen pulang...";



try{


let hasil=
await kirimKeServer({

aksi:"pulang",

nama:nama,

status:"PULANG",

fotoPulang:foto


});



document.getElementById("hasil").innerHTML=

"✅ ABSEN PULANG BERHASIL<br>"+hasil;



}

catch(error){


document.getElementById("hasil").innerHTML=

"❌ Gagal kirim : "+error.message;


}



}





//==============================
// BUKA FORM IZIN
//==============================


function bukaIzin(){


let form=
document.getElementById("formIzin");


if(form.style.display=="none" ||
form.style.display==""){


form.style.display="block";


}

else{


form.style.display="none";


}



}





//==============================
// KIRIM IZIN
//==============================


async function kirimIzin(){


let nama=
document.getElementById("nama")
.value.trim();



if(nama==""){


alert("Isi nama terlebih dahulu");

return;


}



let jenis=
document.getElementById("jenisIzin")
.value;



let keterangan=
document.getElementById("keteranganIzin")
.value;



document.getElementById("hasil").innerHTML=
"Mengirim izin...";



try{


let hasil=
await kirimKeServer({

aksi:"izin",

nama:nama,

status:"IZIN",

keterangan:
jenis+" - "+keterangan


});



document.getElementById("hasil").innerHTML=

"✅ IZIN BERHASIL DIKIRIM<br>"+hasil;



}

catch(error){


document.getElementById("hasil").innerHTML=

"❌ Gagal kirim : "+error.message;


}



}

//==============================
// BUKA PILIH FOTO LAPORAN
//==============================


function bukaKameraLaporan(){


document
.getElementById("fotoLaporan")
.click();


}




//==============================
// KOMPRES FOTO LAPORAN
//==============================


function kompresFileFoto(file,callback){


let reader=
new FileReader();



reader.onload=function(e){


let img=
new Image();



img.onload=function(){


let canvas=
document.createElement("canvas");


let maxWidth=800;


let scale=
maxWidth/img.width;



if(scale>1){

scale=1;

}



canvas.width=
img.width*scale;


canvas.height=
img.height*scale;



let ctx=
canvas.getContext("2d");



ctx.drawImage(
img,
0,
0,
canvas.width,
canvas.height
);



// watermark laporan


ctx.fillStyle=
"rgba(0,0,0,0.6)";


ctx.fillRect(
0,
canvas.height-90,
canvas.width,
90
);



ctx.fillStyle="white";

ctx.font="18px Arial";



let nama=
document.getElementById("nama").value;


let waktu=
new Date();



ctx.fillText(
"UPT PUSKESMAS LONG MESANGAT",
10,
canvas.height-60
);



ctx.fillText(
"Nama : "+nama,
10,
canvas.height-35
);



ctx.fillText(
waktu.toLocaleString("id-ID"),
10,
canvas.height-10
);



callback(
kompresFoto(canvas)
);



};



img.src=e.target.result;



};



reader.readAsDataURL(file);



}




//==============================
// KIRIM LAPORAN KERJA
//==============================


function kirimLaporan(){



let file=
document
.getElementById("fotoLaporan")
.files[0];



if(!file){

return;

}




let nama=
document
.getElementById("nama")
.value.trim();



if(nama==""){


alert("Isi nama terlebih dahulu");


return;


}



document.getElementById("hasil").innerHTML=

"Mengecilkan foto...";





kompresFileFoto(

file,

async function(foto){



document.getElementById("hasil").innerHTML=

"Mengirim laporan...";



try{


let hasil=
await kirimKeServer({

aksi:"laporan",

nama:nama,

foto:foto


});



document.getElementById("hasil").innerHTML=

"✅ LAPORAN BERHASIL DIKIRIM<br>"+hasil;



}

catch(error){


document.getElementById("hasil").innerHTML=

"❌ Gagal kirim : "+error.message;



}



}



);



}





//==============================
// MATIKAN KAMERA
//==============================


function matikanKamera(){


if(kameraStream){


kameraStream
.getTracks()
.forEach(function(track){


track.stop();


});


kameraStream=null;


}


}




//==============================
// CEK HTTPS
//==============================


window.onload=function(){


if(
location.protocol!="https:" &&
location.hostname!="localhost"
){


document.getElementById("hasil").innerHTML=

"⚠️ Kamera membutuhkan HTTPS";


}



};



</script>


</body>

</html>
