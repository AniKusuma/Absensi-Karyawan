<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Absensi Karyawan</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    text-align:center;
    padding:20px;
}

h2{
    color:#1a73e8;
}

input{
    width:90%;
    padding:12px;
    font-size:16px;
    margin:10px;
    border-radius:8px;
    border:1px solid #ccc;
}

button{
    width:90%;
    padding:14px;
    margin:8px;
    font-size:16px;
    border:none;
    border-radius:8px;
    color:white;
}

#kameraBtn{
    background:#ff9800;
}

#masukBtn{
    background:#1a73e8;
}

#pulangBtn{
    background:#e53935;
}

video,img{
    width:300px;
    border-radius:12px;
    border:2px solid #ddd;
    margin-top:10px;
}

#hasil{
    font-weight:bold;
    color:green;
}

#lokasi{
    font-size:13px;
    color:#666;
}

</style>

</head>


<body>


<h2>ABSENSI KARYAWAN</h2>


<input id="nama" placeholder="Masukkan Nama">


<br>


<video 
id="kamera"
autoplay
playsinline
muted>
</video>


<canvas id="canvas"
style="display:none;">
</canvas>


<br>


<button 
id="kameraBtn"
onclick="bukaKamera()">

📷 AKTIFKAN KAMERA

</button>


<img id="preview"
style="display:none;">



<button 
id="masukBtn"
onclick="absenMasuk()">

📍 ABSEN MASUK

</button>



<button 
id="pulangBtn"
onclick="pulang()">

🚪 ABSEN PULANG

</button>

<br>

<button 
id="laporanBtn"
onclick="laporanKerja()"
style="
background:#4caf50;
">

📷 LAPORAN KERJA

</button>


<p id="lokasi"></p>

<p id="hasil"></p>



<script>


// =======================
// URL APPS SCRIPT
// GANTI DENGAN URL ANDA
// =======================


const URL_APPS_SCRIPT =

"https://script.google.com/macros/s/AKfycbwHh4nxokmx_hSyLPMJg9GQYjDXuDFUA5Z6GfGN-vSglje5f2mgeBGEqQFyOsk4O_zv/exec";



// =======================
// LOKASI KANTOR
// =======================


const LAT_KANTOR = 0.6364024882517407;

const LNG_KANTOR = 116.69394079221424;


// radius 200 meter

const RADIUS = 200;



let latitude="";

let longitude="";

let kameraStream=null;


// foto laporan kerja

let fotoLaporan="";

// =======================
// HITUNG JARAK GPS
// =======================

function hitungJarak(lat1,lon1,lat2,lon2){

const R = 6371000;

const dLat =
(lat2-lat1) * Math.PI / 180;

const dLon =
(lon2-lon1) * Math.PI / 180;


const a =

Math.sin(dLat/2) *
Math.sin(dLat/2)

+

Math.cos(lat1*Math.PI/180) *
Math.cos(lat2*Math.PI/180)

*

Math.sin(dLon/2) *
Math.sin(dLon/2);


const c =
2 *
Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
);


return R*c;

}



// =======================
// AKTIFKAN KAMERA
// =======================


function bukaKamera(){


const video=document.getElementById("kamera");


navigator.mediaDevices.getUserMedia({

video:{
    facingMode:"user",
    width:{
        ideal:640
    },
    height:{
        ideal:480
    }
},

audio:false


})


.then(function(stream){


kameraStream=stream;


video.srcObject=stream;


video.play();



document.getElementById("hasil").innerHTML =
"✅ Kamera aktif";


})


.catch(function(error){


alert(
"Kamera gagal:\n"+
error.name+
"\n"+
error.message
);


});


}






// =======================
// AMBIL FOTO WATERMARK
// =======================


function ambilFoto(){


let video=document.getElementById("kamera");


let canvas=document.getElementById("canvas");


if(video.videoWidth==0){

alert("Kamera belum siap");

return "";

}


canvas.width=video.videoWidth;

canvas.height=video.videoHeight;


let ctx=canvas.getContext("2d");


ctx.drawImage(

video,

0,

0,

canvas.width,

canvas.height

);



// watermark

ctx.fillStyle="rgba(0,0,0,0.6)";


ctx.fillRect(

0,

canvas.height-120,

canvas.width,

120

);



ctx.fillStyle="white";

ctx.font="22px Arial";


let nama =
document.getElementById("nama").value;


let waktu = new Date();



ctx.fillText(

"UPT PUSKESMAS LONG MESANGAT",

20,

canvas.height-90

);



ctx.fillText(

"Nama : "+nama,

20,

canvas.height-60

);



ctx.fillText(

"Tanggal : "+
waktu.toLocaleDateString("id-ID"),

20,

canvas.height-35

);



ctx.fillText(

"Jam : "+
waktu.toLocaleTimeString("id-ID"),

20,

canvas.height-10

);



return canvas.toDataURL(

"image/jpeg",

0.9

);


}
// =======================
// ABSEN MASUK
// =======================


function absenMasuk(){


let nama =
document.getElementById("nama")
.value.trim();



if(nama==""){

alert("Isi nama terlebih dahulu");

return;

}



document.getElementById("hasil").innerHTML =
"Mengambil lokasi...";



navigator.geolocation.getCurrentPosition(



function(pos){


latitude =
pos.coords.latitude;


longitude =
pos.coords.longitude;



document.getElementById("lokasi").innerHTML =

"Latitude : "+latitude+
"<br>"+
"Longitude : "+longitude;



// =======================
// CEK JARAK KANTOR
// =======================


let jarak = hitungJarak(

latitude,
longitude,

LAT_KANTOR,
LNG_KANTOR

);



if(jarak > RADIUS){


alert(

"❌ Absen ditolak\n\n"+
"Anda berada di luar area kantor.\n"+
"Jarak Anda : "+
Math.round(jarak)+
" meter"

);


document.getElementById("hasil").innerHTML =
"Lokasi tidak sesuai";


return;


}



document.getElementById("hasil").innerHTML =

"✅ Lokasi sesuai\n"+
"Jarak : "+
Math.round(jarak)+
" meter";





// ambil foto

let foto = ambilFoto();



if(foto==""){

return;

}



document.getElementById("preview").src=foto;

document.getElementById("preview").style.display="block";



document.getElementById("hasil").innerHTML =
"Mengirim data...";





// kirim ke Apps Script


fetch(

URL_APPS_SCRIPT,

{

method:"POST",

body:JSON.stringify({

aksi:"masuk",

nama:nama,

latitude:latitude,

longitude:longitude,

foto:foto

})

}

)



.then(function(res){

return res.text();

})


.then(function(data){


document.getElementById("hasil").innerHTML=data;


})


.catch(function(error){


document.getElementById("hasil").innerHTML=

"Error : "+error;


});





},



function(){


alert("GPS tidak aktif");


},


{

enableHighAccuracy:true,

timeout:10000,

maximumAge:0

}



);



}







// =======================
// ABSEN PULANG
// =======================


function pulang(){


let nama =
document.getElementById("nama")
.value.trim();



if(nama==""){

alert("Isi nama terlebih dahulu");

return;

}



fetch(

URL_APPS_SCRIPT,

{

method:"POST",

body:JSON.stringify({

aksi:"pulang",

nama:nama

})

}

)



.then(function(res){

return res.text();

})


.then(function(data){

document.getElementById("hasil").innerHTML=data;

})


.catch(function(error){

document.getElementById("hasil").innerHTML=
"Error : "+error;

});


}


// =======================
// LAPORAN KERJA FOTO
// =======================


function laporanKerja(){


let nama =
document.getElementById("nama")
.value.trim();



if(nama==""){

alert("Isi nama terlebih dahulu");

return;

}



let video =
document.getElementById("kamera");


if(video.videoWidth==0){

alert("Aktifkan kamera terlebih dahulu");

return;

}



let canvas =
document.getElementById("canvas");


canvas.width =
video.videoWidth;


canvas.height =
video.videoHeight;



let ctx =
canvas.getContext("2d");



// ambil foto kegiatan

ctx.drawImage(

video,

0,

0,

canvas.width,

canvas.height

);




// =======================
// WATERMARK LAPORAN
// =======================


ctx.fillStyle =
"rgba(0,0,0,0.6)";


ctx.fillRect(

0,

canvas.height-120,

canvas.width,

120

);



let waktu = new Date();


ctx.fillStyle="white";

ctx.font="22px Arial";



ctx.fillText(

"UPT PUSKESMAS LONG MESANGAT",

20,

canvas.height-90

);



ctx.fillText(

"Nama : "+nama,

20,

canvas.height-60

);



ctx.fillText(

"Tanggal : "+
waktu.toLocaleDateString("id-ID"),

20,

canvas.height-35

);



ctx.fillText(

"Jam : "+
waktu.toLocaleTimeString("id-ID"),

20,

canvas.height-10

);




// ubah menjadi gambar

fotoLaporan =
canvas.toDataURL(

"image/jpeg",

0.9

);




// tampilkan preview

document.getElementById("preview").src =
fotoLaporan;


document.getElementById("preview").style.display =
"block";



document.getElementById("hasil").innerHTML =
"Mengirim laporan...";





// kirim ke Apps Script


fetch(

URL_APPS_SCRIPT,

{

method:"POST",

body:JSON.stringify({

aksi:"laporan",

nama:nama,

foto:fotoLaporan

})

}

)



.then(function(res){

return res.text();

})



.then(function(data){


document.getElementById("hasil").innerHTML=data;


})



.catch(function(error){


document.getElementById("hasil").innerHTML=

"Error : "+error;


});



}
</script>


</body>

</html>
