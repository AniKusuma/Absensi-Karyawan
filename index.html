<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Absensi Puskesmas</title>


<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    text-align:center;
    padding:20px;
}


h2{
    color:#1a73e8;
}


input,select,textarea{

    width:90%;
    padding:12px;
    font-size:16px;
    margin:10px;
    border-radius:8px;
    border:1px solid #ccc;

}


button{

    padding:14px;
    margin:8px;
    font-size:16px;
    border:none;
    border-radius:8px;

#kameraBtn{

</style>


</head>


<body>


<h2>
ABSENSI KARYAWAN
</h2>



<input 
id="nama"
placeholder="Masukkan Nama">



<br>



<!-- PILIH STATUS ABSEN -->

<select id="modeAbsen">


<option value="kantor">

🏥 Absen Puskesmas

</option>



<option value="rujukan">

🚑 Tugas Rujukan

</option>


</select>



<br>




<!-- KAMERA ABSEN -->


<video
id="kamera"
autoplay
playsinline
muted>
</video>



<canvas
id="canvas"
style="display:none;">
</canvas>



<br>



<button
id="kameraBtn"
onclick="bukaKameraDepan()">

📷 AKTIFKAN KAMERA ABSEN

</button>



<img
id="preview"
style="display:none;">



<br>



<button
id="masukBtn"
onclick="absenMasuk()">

📍 ABSEN MASUK

</button>



<button
id="pulangBtn"
onclick="pulang()">

🚪 ABSEN PULANG

</button>


<br>



<button
id="izinBtn"
onclick="bukaIzin()">

📝 AJUKAN IZIN

</button>


<hr>



<!-- FORM IZIN -->


<div id="formIzin">


<h3>
FORM IZIN
</h3>



<select id="jenisIzin">


<option value="Sakit">
Sakit
</option>


<option value="Keperluan Keluarga">
Keperluan Keluarga
</option>


<option value="Lainnya">
Lainnya
</option>



</select>



<textarea
id="keteranganIzin"
placeholder="Keterangan izin">
</textarea>




<button
id="kirimIzinBtn"
onclick="kirimIzin()">

KIRIM IZIN

</button>



</div>




<hr>



<h3>
LAPORAN KERJA
</h3>



<input

type="file"

id="fotoLaporan"

accept="image/*"

capture="environment"

style="display:none"

onchange="kirimLaporan()">





<button

id="laporanBtn"

onclick="bukaKameraLaporan()">


📷 FOTO LAPORAN KERJA


</button>





<p id="lokasi"></p>


<p id="hasil"></p>

<script>


// ==============================
// URL GOOGLE APPS SCRIPT
// ==============================


const URL_APPS_SCRIPT =

"https://script.google.com/macros/s/AKfycbwHh4nxokmx_hSyLPMJg9GQYjDXuDFUA5Z6GfGN-vSglje5f2mgeBGEqQFyOsk4O_zv/exec";




// ==============================
// DATA LOKASI ABSEN
// ==============================


// Koordinat bisa disesuaikan lagi


const DAFTAR_LOKASI = [



{

nama:"Puskesmas Long Mesangat",

lat:0.636402,

lng:116.693940,

radius:5000

},



{

nama:"Rujukan Samarinda",

lat:-0.5022,

lng:117.1536,

radius:30000

},




{

nama:"Rujukan Sangatta",

lat:0.4948,

lng:117.1436,

radius:30000

},




{

nama:"Rujukan Tenggarong",

lat:-0.4267,

lng:116.9872,

radius:30000

},




{

nama:"Rujukan Muara Bengkal",

lat:0.1040,

lng:116.9000,

radius:30000

}



];





let latitude="";

let longitude="";

let kameraStream=null;






// ==============================
// HITUNG JARAK GPS
// ==============================



function hitungJarak(lat1,lon1,lat2,lon2){



const R=6371000;



const dLat=

(lat2-lat1)*

Math.PI/180;



const dLon=

(lon2-lon1)*

Math.PI/180;




const a =

Math.sin(dLat/2) *

Math.sin(dLat/2)

+

Math.cos(lat1*Math.PI/180)

*

Math.cos(lat2*Math.PI/180)

*

Math.sin(dLon/2)

*

Math.sin(dLon/2);





const c=

2*

Math.atan2(

Math.sqrt(a),

Math.sqrt(1-a)

);




return R*c;


}





// ==============================
// CEK WILAYAH ABSEN
// ==============================



function cekWilayahAbsen(lat,lng){



let hasil="Lokasi tidak dikenal";



DAFTAR_LOKASI.forEach(function(item){



let jarak = hitungJarak(

lat,

lng,

item.lat,

item.lng

);





if(jarak <= item.radius){


hasil=item.nama;


}



});



return hasil;



}

// ==============================
// AKTIFKAN KAMERA ABSEN
// ==============================


function bukaKameraDepan(){


const video=document.getElementById("kamera");



navigator.mediaDevices.getUserMedia({


video:{


facingMode:"user",


width:{
ideal:640
},


height:{
ideal:480
}


},


audio:false



})


.then(function(stream){


kameraStream=stream;


video.srcObject=stream;


video.play();



document.getElementById("hasil").innerHTML=

"✅ Kamera absensi aktif";



})


.catch(function(error){


alert(

"Kamera gagal : "+error.message

);


});



}






// ==============================
// AMBIL FOTO ABSEN
// ==============================



function ambilFotoAbsen(){



let video=document.getElementById("kamera");



if(video.videoWidth==0){


alert("Kamera belum siap");


return "";

}



let canvas=document.getElementById("canvas");



canvas.width=video.videoWidth;

canvas.height=video.videoHeight;




let ctx=canvas.getContext("2d");



ctx.drawImage(

video,

0,

0,

canvas.width,

canvas.height

);




// WATERMARK



ctx.fillStyle="rgba(0,0,0,0.6)";


ctx.fillRect(

0,

canvas.height-120,

canvas.width,

120

);




ctx.fillStyle="white";


ctx.font="22px Arial";



let nama=document.getElementById("nama").value;



let waktu=new Date();





ctx.fillText(

"UPT PUSKESMAS LONG MESANGAT",

20,

canvas.height-90

);




ctx.fillText(

"Nama : "+nama,

20,

canvas.height-60

);




ctx.fillText(

"Tanggal : "+

waktu.toLocaleDateString("id-ID"),

20,

canvas.height-35

);




ctx.fillText(

"Jam : "+

waktu.toLocaleTimeString("id-ID"),

20,

canvas.height-10

);





return canvas.toDataURL(

"image/jpeg",

0.5

);



}








// ==============================
// ABSEN MASUK
// ==============================



function absenMasuk(){



let nama=document.getElementById("nama")

.value.trim();




if(nama==""){


alert("Isi nama terlebih dahulu");


return;


}




let mode=document.getElementById("modeAbsen")

.value;





document.getElementById("hasil").innerHTML=

"Mengambil lokasi...";







navigator.geolocation.getCurrentPosition(



function(pos){



latitude=pos.coords.latitude;


longitude=pos.coords.longitude;






let wilayah=cekWilayahAbsen(

latitude,

longitude

);







document.getElementById("lokasi").innerHTML=

"Latitude : "+latitude+

"<br>Longitude : "+longitude+

"<br>Lokasi : "+wilayah;







let foto=ambilFotoAbsen();





if(foto==""){


return;


}






document.getElementById("hasil").innerHTML=

"Mengirim data...";







fetch(

URL_APPS_SCRIPT,

{


method:"POST",


body:JSON.stringify({


aksi:"masuk",


nama:nama,


status:"HADIR",


mode:mode,


keterangan:

(mode=="rujukan")

?

"Tugas Rujukan"

:

"Masuk Kerja",



latitude:latitude,


longitude:longitude,


lokasiAbsen:wilayah,


foto:foto



})


}



)




.then(function(res){


return res.text();


})



.then(function(data){



document.getElementById("hasil").innerHTML=data;


})



.catch(function(error){



document.getElementById("hasil").innerHTML=

"Error : "+error;


});




},




function(){


alert("GPS tidak aktif");


},



{


enableHighAccuracy:true,

timeout:10000,

maximumAge:0


}




);



}

// ==============================
// MENU IZIN
// ==============================


function bukaIzin(){


document.getElementById("formIzin")

.style.display="block";


}




// ==============================
// KIRIM IZIN
// ==============================


function kirimIzin(){



let nama=document.getElementById("nama")

.value.trim();




let jenis=document.getElementById("jenisIzin")

.value;




let ket=document.getElementById("keteranganIzin")

.value;





if(nama==""){


alert("Isi nama terlebih dahulu");


return;


}





document.getElementById("hasil").innerHTML=

"Mengirim izin...";







fetch(

URL_APPS_SCRIPT,

{


method:"POST",


body:JSON.stringify({


aksi:"izin",


nama:nama,


status:"IZIN",


keterangan:

jenis+" "+ket



})


}



)




.then(function(res){


return res.text();


})



.then(function(data){


document.getElementById("hasil").innerHTML=data;


})



.catch(function(error){



document.getElementById("hasil").innerHTML=

"Error : "+error;


});




}







// ==============================
// LAPORAN KERJA
// ==============================



function bukaKameraLaporan(){



document.getElementById("fotoLaporan")

.click();



}







function kirimLaporan(){



let file=

document.getElementById("fotoLaporan")

.files[0];




if(!file){

return;

}





let nama=

document.getElementById("nama")

.value.trim();






if(nama==""){


alert("Isi nama terlebih dahulu");


return;


}





document.getElementById("hasil").innerHTML=

"Membaca foto...";





let reader=new FileReader();





reader.onload=function(e){



let foto=e.target.result;




document.getElementById("hasil").innerHTML=

"Mengirim laporan...";







fetch(

URL_APPS_SCRIPT,

{


method:"POST",


body:JSON.stringify({


aksi:"laporan",


nama:nama,


foto:foto


})


}



)




.then(function(res){


return res.text();


})



.then(function(data){


document.getElementById("hasil").innerHTML=data;


})



.catch(function(error){



document.getElementById("hasil").innerHTML=

"Error : "+error;


});



};




reader.readAsDataURL(file);



}








// ==============================
// ABSEN PULANG
// ==============================



function pulang(){



let nama=

document.getElementById("nama")

.value.trim();





if(nama==""){


alert("Isi nama terlebih dahulu");


return;


}





document.getElementById("hasil").innerHTML=

"Mengirim absen pulang...";






fetch(

URL_APPS_SCRIPT,

{


method:"POST",


body:JSON.stringify({


aksi:"pulang",


nama:nama,


status:"PULANG"



})


}



)



.then(function(res){


return res.text();


})



.then(function(data){



document.getElementById("hasil").innerHTML=data;


})



.catch(function(error){



document.getElementById("hasil").innerHTML=

"Error : "+error;


});



}
