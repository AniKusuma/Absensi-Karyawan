<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Absensi & Laporan Kerja</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    text-align:center;
    padding:20px;
}

h2{
    color:#1a73e8;
}

input,select{

    width:90%;
    padding:12px;
    font-size:16px;
    margin:10px;
    border-radius:8px;
    border:1px solid #ccc;

}


button{

    width:90%;
    padding:14px;
    margin:8px;
    font-size:16px;
    border:none;
    border-radius:8px;
    color:white;

}


#kameraBtn{
    background:#ff9800;
}


#masukBtn{
    background:#1a73e8;
}


#pulangBtn{
    background:#e53935;
}


#laporanBtn{
    background:#43a047;
}


video,img{

    width:300px;
    border-radius:12px;
    border:2px solid #ddd;
    margin-top:10px;

}


#hasil{

    font-weight:bold;
    color:green;

}


#lokasi{

    font-size:13px;
    color:#666;

}


</style>

</head>


<body>


<h2>ABSENSI KARYAWAN</h2>


<input 
id="nama"
placeholder="Masukkan Nama">


<br>


<select id="modeAbsen">

<option value="kantor">
🏥 Absen di Puskesmas
</option>

<option value="luar">
🚑 Tugas Luar / Rujukan
</option>

</select>



<br>


<video
id="kamera"
autoplay
playsinline
muted>
</video>


<canvas
id="canvas"
style="display:none;">
</canvas>


<br>


<button
id="kameraBtn"
onclick="bukaKameraDepan()">

📷 AKTIFKAN KAMERA ABSEN

</button>


<img 
id="preview"
style="display:none;">



<br>


<button
id="masukBtn"
onclick="absenMasuk()">

📍 ABSEN MASUK

</button>


<button
id="pulangBtn"
onclick="pulang()">

🚪 ABSEN PULANG

</button>


<hr>


<h3>LAPORAN KERJA</h3>


<input

type="file"

id="fotoLaporan"

accept="image/*"

capture="environment"

style="display:none"

onchange="kirimLaporan()">


<button
id="laporanBtn"
onclick="bukaKameraLaporan()">

📷 FOTO LAPORAN KERJA

</button>


<p id="lokasi"></p>

<p id="hasil"></p>


<script>
    
// ==============================
// URL GOOGLE APPS SCRIPT
// ==============================

const URL_APPS_SCRIPT =

"https://script.google.com/macros/s/AKfycbwHh4nxokmx_hSyLPMJg9GQYjDXuDFUA5Z6GfGN-vSglje5f2mgeBGEqQFyOsk4O_zv/exec";



// ==============================
// KOORDINAT KANTOR
// ==============================

const LAT_KANTOR = 0.6364024882517407;

const LNG_KANTOR = 116.69394079221424;


// Radius masih disimpan,
// tetapi tidak digunakan sementara

const RADIUS = 200;



let latitude = "";

let longitude = "";

let kameraStream = null;




// ==============================
// HITUNG JARAK GPS
// ==============================

function hitungJarak(lat1,lon1,lat2,lon2){


const R = 6371000;


const dLat =
(lat2-lat1) *
Math.PI / 180;


const dLon =
(lon2-lon1) *
Math.PI / 180;


const a =

Math.sin(dLat/2) *
Math.sin(dLat/2)

+

Math.cos(lat1*Math.PI/180) *
Math.cos(lat2*Math.PI/180)

*

Math.sin(dLon/2) *
Math.sin(dLon/2);



const c =
2 *
Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
);



return R*c;


}





// ==============================
// KAMERA DEPAN ABSEN
// ==============================


function bukaKameraDepan(){


const video =
document.getElementById("kamera");



navigator.mediaDevices.getUserMedia({

video:{


facingMode:"user",


width:{
ideal:640
},


height:{
ideal:480
}


},


audio:false


})


.then(function(stream){


kameraStream = stream;


video.srcObject = stream;


video.play();


document.getElementById("hasil").innerHTML =

"✅ Kamera absensi aktif";


})


.catch(function(error){


alert(
"Kamera gagal:\n"+
error.message
);


});


}





// ==============================
// AMBIL FOTO ABSEN + WATERMARK
// ==============================


function ambilFotoAbsen(){


let video =
document.getElementById("kamera");



if(video.videoWidth==0){


alert("Kamera belum siap");


return "";

}



let canvas =
document.getElementById("canvas");



canvas.width =
video.videoWidth;


canvas.height =
video.videoHeight;



let ctx =
canvas.getContext("2d");



ctx.drawImage(

video,

0,

0,

canvas.width,

canvas.height

);





// WATERMARK


ctx.fillStyle =
"rgba(0,0,0,0.6)";


ctx.fillRect(

0,

canvas.height-120,

canvas.width,

120

);



ctx.fillStyle="white";


ctx.font="22px Arial";



let nama =
document.getElementById("nama").value;



let waktu =
new Date();




ctx.fillText(

"UPT PUSKESMAS LONG MESANGAT",

20,

canvas.height-90

);



ctx.fillText(

"Nama : "+nama,

20,

canvas.height-60

);



ctx.fillText(

"Tanggal : "+
waktu.toLocaleDateString("id-ID"),

20,

canvas.height-35

);



ctx.fillText(

"Jam : "+
waktu.toLocaleTimeString("id-ID"),

20,

canvas.height-10

);




return canvas.toDataURL(

"image/jpeg",

0.9

);



}
    
// ==============================
// ABSEN MASUK
// ==============================


function absenMasuk(){


let nama =

document.getElementById("nama")
.value.trim();



if(nama==""){


alert("Isi nama terlebih dahulu");

return;


}



let mode =

document.getElementById("modeAbsen")
.value;




document.getElementById("hasil").innerHTML =

"Mengambil lokasi...";





navigator.geolocation.getCurrentPosition(


function(pos){



latitude =

pos.coords.latitude;



longitude =

pos.coords.longitude;




document.getElementById("lokasi").innerHTML =


"Latitude : "+
latitude+
"<br>Longitude : "+
longitude;





// Hitung jarak hanya untuk catatan

let jarak = hitungJarak(

latitude,

longitude,

LAT_KANTOR,

LNG_KANTOR

);




// ==============================
// PEMERIKSAAN RADIUS DINONAKTIFKAN
// ==============================


// Jika ingin aktif kembali,
// buka komentar kode ini


/*
if(mode=="kantor" && jarak > RADIUS){

document.getElementById("hasil").innerHTML =

"❌ Di luar area kantor";


alert(

"Absen ditolak\nJarak Anda "+
Math.round(jarak)+
" meter"

);


return;

}
*/





let foto = ambilFotoAbsen();



if(foto==""){


return;


}




document.getElementById("hasil").innerHTML =

"Mengirim data...";






fetch(

URL_APPS_SCRIPT,

{


method:"POST",


body:JSON.stringify({


aksi:"masuk",


nama:nama,


mode:mode,


latitude:latitude,


longitude:longitude,


jarak:Math.round(jarak),


foto:foto


})


}

)




.then(function(res){


return res.text();


})




.then(function(data){


document.getElementById("hasil").innerHTML=data;


})




.catch(function(error){


document.getElementById("hasil").innerHTML=

"Error : "+error;


});




},




function(){


alert("GPS tidak aktif");


},




{


enableHighAccuracy:true,


timeout:10000,


maximumAge:0


}



);



}

// ==============================
// LAPORAN KERJA
// ==============================


function bukaKameraLaporan(){


document.getElementById("fotoLaporan").click();


}





// ==============================
// KIRIM LAPORAN KERJA
// ==============================


function kirimLaporan(){



let file =

document.getElementById("fotoLaporan")
.files[0];



if(!file){

return;

}




let nama =

document.getElementById("nama")
.value.trim();




if(nama==""){


alert("Isi nama terlebih dahulu");


return;


}





document.getElementById("hasil").innerHTML =

"Membaca foto...";




let reader = new FileReader();




reader.onload = function(e){



let foto = e.target.result;




document.getElementById("hasil").innerHTML =

"Mengirim laporan...";






fetch(

URL_APPS_SCRIPT,

{


method:"POST",


body:JSON.stringify({


aksi:"laporan",


nama:nama,


foto:foto


})


}

)




.then(function(res){


return res.text();


})




.then(function(data){


document.getElementById("hasil").innerHTML=data;


})




.catch(function(error){


document.getElementById("hasil").innerHTML=

"Error : "+error;


});



};



reader.readAsDataURL(file);



}







// ==============================
// ABSEN PULANG
// ==============================


function pulang(){



let nama =

document.getElementById("nama")
.value.trim();




if(nama==""){


alert("Isi nama terlebih dahulu");


return;


}







fetch(

URL_APPS_SCRIPT,

{


method:"POST",


body:JSON.stringify({


aksi:"pulang",


nama:nama


})


}

)





.then(function(res){


return res.text();


})




.then(function(data){


document.getElementById("hasil").innerHTML=data;


})




.catch(function(error){


document.getElementById("hasil").innerHTML=

"Error : "+error;


});



}


</script>


</body>

</html>
